[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-pdf-wrap"
version = "0.1.1"
description = "Convert a PDF to an EPUB by wrapping each rendered page in an EPUB page"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Andrea Esuli", email = "andrea@esuli.it" },
]
urls = { "Home" = "https://github.com/aesuli/epub_pdf_wrap" }
keywords = ["pdf", "epub", "conversion", "render"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ebooklib>=0.18",
]

[project.scripts]
epub-pdf-wrap = "epub_pdf_wrap.__main__:main"

[tool.setuptools]
packages = ["epub_pdf_wrap"]
